# Roda a verificação mecânica do repositório em todo push e pull request.
# Não instala nada: bash e Python 3 já vêm no runner do GitHub.
name: check-docs
on:
  push:
  pull_request:
jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-docs.sh
