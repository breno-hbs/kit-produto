# Roda a verificação mecânica do repositório em todo push e pull request.
# No kit cru só valida a estrutura (bash e Python 3 já vêm no runner). O /configurar-projeto
# acrescenta aqui o setup da stack e o comando de teste e lint do projeto.
name: check-docs
on:
  push:
  pull_request:
jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-docs.sh
